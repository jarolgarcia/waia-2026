services:
  db:
    image: mysql:8.0
    container_name: waia_db
    restart: always
    environment:
      MYSQL_DATABASE: waia_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waia_backend
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: waia_db
      DB_USER: root
      DB_PASS: root_password
    depends_on:
      - db
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waia_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
volumes:
  db_data:
