services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_USE_API: "true"
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - waia_uploads:/var/www/html/backend/uploads:ro
    networks: [public, internal]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: ${WAIA_ENV_FILE:-.env.production}
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - waia_uploads:/var/www/html/backend/uploads
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.4
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - waia_db:/var/lib/mysql
      - ./database/schema/waia_database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

networks:
  public: {}
  internal:
    internal: true

volumes:
  waia_db:
  waia_uploads:
